<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IST Flip Clock</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #000;
    color: #bbb;
    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

/* AM / PM */
#period {
    position: fixed;
    top: 28px;
    left: 35px;

    font-size: 42px;
    font-weight: 700;

    color: #bbb;
}

/* IST label */
.label {
    position: fixed;
    bottom: 20px;
    left: 28px;

    color: #666;
    font-size: 14px;
    letter-spacing: 1px;
}

/* Whole clock */
.clock {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 20px;
}

/* Pair */
.group {
    display: flex;
    gap: 8px;
}

/* Colon */
.colon {
    font-size: 65px;
    font-weight: bold;
    color: #777;
}

/* One card */
.digit {
    position: relative;

    width: 190px;
    height: 300px;

    background: #111;

    border-radius: 22px;

    perspective: 1000px;

    overflow: hidden;
}

/* Half card */
.half {
    position: absolute;

    left: 0;

    width: 100%;
    height: 50%;

    overflow: hidden;

    background: #111;
}

/* Top */
.top {
    top: 0;
}

/* Bottom */
.bottom {
    bottom: 0;
}

/* Number */
.number {
    position: absolute;

    left: 0;

    width: 100%;
    height: 200%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Arial, Helvetica, sans-serif;

    font-variant-numeric: tabular-nums;

    font-size: 245px;
    font-weight: 700;

    color: #bbb;

    line-height: 1;

    user-select: none;
}

/* Correct vertical placement */
.top .number {
    top: 0;
}

.bottom .number {
    bottom: 0;
}

/* Center black split */
.digit::after {
    content: "";

    position: absolute;

    z-index: 50;

    left: 0;
    right: 0;

    top: 50%;

    height: 5px;

    transform: translateY(-50%);

    background: #050505;
}

/* ============================
   FLIPPING TOP HALF
============================ */

.flip-top {
    position: absolute;

    z-index: 30;

    left: 0;
    top: 0;

    width: 100%;
    height: 50%;

    background: #111;

    overflow: hidden;

    transform-origin: bottom;

    backface-visibility: hidden;
}

.flip-top .number {
    top: 0;
}

/* ============================
   FLIPPING BOTTOM HALF
============================ */

.flip-bottom {
    position: absolute;

    z-index: 29;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 50%;

    background: #111;

    overflow: hidden;

    transform-origin: top;

    transform: rotateX(90deg);

    backface-visibility: hidden;
}

.flip-bottom .number {
    bottom: 0;
}

/* First half of flip */
.flip-top.animate {
    animation: topFlip 0.35s ease-in forwards;
}

/* Second half */
.flip-bottom.animate {
    animation: bottomFlip 0.35s ease-out 0.35s forwards;
}

/* Old top folds downward */
@keyframes topFlip {

    0% {
        transform: rotateX(0deg);
        filter: brightness(1);
    }

    100% {
        transform: rotateX(-90deg);
        filter: brightness(.45);
    }
}

/* New bottom unfolds */
@keyframes bottomFlip {

    0% {
        transform: rotateX(90deg);
        filter: brightness(.45);
    }

    100% {
        transform: rotateX(0deg);
        filter: brightness(1);
    }
}

/* Responsive */
@media (max-width: 1300px) {

    .digit {
        width: 150px;
        height: 240px;
    }

    .number {
        font-size: 195px;
    }

    .clock {
        gap: 12px;
    }

    .colon {
        font-size: 50px;
    }
}

@media (max-width: 800px) {

    .digit {
        width: 14vw;
        height: 23vw;
        border-radius: 10px;
    }

    .number {
        font-size: 19vw;
    }

    .clock {
        gap: 5px;
    }

    .group {
        gap: 3px;
    }

    .colon {
        font-size: 25px;
    }

    #period {
        top: 15px;
        left: 18px;
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div id="period">AM</div>

<div class="clock">

    <!-- HOURS -->
    <div class="group">
        <div class="digit" id="h1"></div>
        <div class="digit" id="h2"></div>
    </div>

    <div class="colon">:</div>

    <!-- MINUTES -->
    <div class="group">
        <div class="digit" id="m1"></div>
        <div class="digit" id="m2"></div>
    </div>

    <div class="colon">:</div>

    <!-- SECONDS -->
    <div class="group">
        <div class="digit" id="s1"></div>
        <div class="digit" id="s2"></div>
    </div>

</div>

<div class="label">
    IST • INDIA STANDARD TIME
</div>

<script>

const ids = [
    "h1",
    "h2",
    "m1",
    "m2",
    "s1",
    "s2"
];

let previousTime = null;


/* Build each digit */
function createDigit(element, value) {

    element.innerHTML = `

        <div class="half top">
            <div class="number">${value}</div>
        </div>

        <div class="half bottom">
            <div class="number">${value}</div>
        </div>

        <div class="flip-top">
            <div class="number">${value}</div>
        </div>

        <div class="flip-bottom">
            <div class="number">${value}</div>
        </div>
    `;
}


/* First load */
function createClock(time) {

    ids.forEach((id, i) => {

        createDigit(
            document.getElementById(id),
            time[i]
        );

    });
}


/* Animate one changed digit */
function flipDigit(element, oldValue, newValue) {

    const top =
        element.querySelector(".top .number");

    const bottom =
        element.querySelector(".bottom .number");

    const flipTop =
        element.querySelector(".flip-top");

    const flipBottom =
        element.querySelector(".flip-bottom");

    const flipTopNumber =
        flipTop.querySelector(".number");

    const flipBottomNumber =
        flipBottom.querySelector(".number");


    /* Old digit */
    top.textContent = oldValue;
    flipTopNumber.textContent = oldValue;

    /* New digit */
    bottom.textContent = newValue;
    flipBottomNumber.textContent = newValue;


    /* Reset animation */
    flipTop.classList.remove("animate");
    flipBottom.classList.remove("animate");

    void flipTop.offsetWidth;


    /* Animate both halves */
    flipTop.classList.add("animate");
    flipBottom.classList.add("animate");


    /* Finish */
    setTimeout(() => {

        top.textContent = newValue;
        bottom.textContent = newValue;

        flipTopNumber.textContent = newValue;
        flipBottomNumber.textContent = newValue;

        flipTop.classList.remove("animate");
        flipBottom.classList.remove("animate");

    }, 700);
}


/* Get IST */
function getIST() {

    const parts =
        new Intl.DateTimeFormat(
            "en-IN",
            {
                timeZone: "Asia/Kolkata",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: true
            }
        ).formatToParts(new Date());


    let hour = "";
    let minute = "";
    let second = "";
    let period = "";


    for (const part of parts) {

        if (part.type === "hour") {
            hour = part.value;
        }

        if (part.type === "minute") {
            minute = part.value;
        }

        if (part.type === "second") {
            second = part.value;
        }

        if (part.type === "dayPeriod") {
            period = part.value.toUpperCase();
        }
    }


    hour = hour.padStart(2, "0");


    return {
        digits: hour + minute + second,
        period: period
    };
}


/* Update */
function updateClock() {

    const current = getIST();

    document.getElementById("period").textContent =
        current.period;


    if (previousTime === null) {

        createClock(current.digits);

        previousTime = current.digits;

        return;
    }


    ids.forEach((id, index) => {

        const oldValue =
            previousTime[index];

        const newValue =
            current.digits[index];


        if (oldValue !== newValue) {

            flipDigit(
                document.getElementById(id),
                oldValue,
                newValue
            );
        }

    });


    previousTime = current.digits;
}


updateClock();

setInterval(updateClock, 1000);

</script>

</body>
</html>
