<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>IST Flip Clock</title>


<style>

/* =========================================
   PAGE
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {

    background: #000;

    color: #bdbdbd;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;

    display: flex;

    justify-content: center;

    align-items: center;
}


/* =========================================
   AM / PM
========================================= */

.period {

    position: fixed;

    top: 28px;
    left: 35px;

    color: #bdbdbd;

    font-size: 40px;

    font-weight: 700;

    letter-spacing: -1px;
}


/* =========================================
   CLOCK
========================================= */

.clock {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 28px;

    width: 96vw;
}


/* =========================================
   GROUP
========================================= */

.group {

    display: flex;

    gap: 10px;

    flex-shrink: 0;
}


/* =========================================
   DIGIT CARD
========================================= */

.digit {

    position: relative;

    width: 190px;

    height: 300px;

    background: #111;

    border-radius: 22px;

    overflow: hidden;

    perspective: 1200px;

    flex-shrink: 0;

    box-shadow:
        inset 0 0 35px rgba(255,255,255,0.025),
        0 8px 25px rgba(0,0,0,0.8);
}


/* =========================================
   TOP HALF
========================================= */

.top {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 50%;

    overflow: hidden;

    background: #111;

    z-index: 5;
}


/* =========================================
   BOTTOM HALF
========================================= */

.bottom {

    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 50%;

    overflow: hidden;

    background: #111;

    z-index: 4;
}


/* =========================================
   NUMBERS
========================================= */

.num {

    position: absolute;

    width: 100%;

    height: 200%;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #bdbdbd;

    /*
       Fixed-width numeric appearance
    */

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size: 255px;

    font-weight: 700;

    line-height: 1;

    letter-spacing: -18px;

    user-select: none;

}


/* Top number */

.top .num {

    top: 0;

}


/* Bottom number */

.bottom .num {

    bottom: 0;

}


/* =========================================
   CENTER LINE
========================================= */

.digit::after {

    content: "";

    position: absolute;

    z-index: 100;

    left: 0;
    right: 0;

    top: 50%;

    height: 5px;

    transform:
        translateY(-50%);

    background: #050505;

    box-shadow:
        0 1px 2px rgba(255,255,255,0.05);
}


/* =========================================
   FULL FLIP CARD
========================================= */

.flip-card {

    position: absolute;

    z-index: 50;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    transform-style: preserve-3d;

    transform-origin: center center;

    pointer-events: none;

}


/*
   FRONT
*/

.flip-front {

    position: absolute;

    width: 100%;
    height: 100%;

    background: #111;

    backface-visibility: hidden;

    overflow: hidden;

    border-radius: 22px;

}


/*
   Number on front
*/

.flip-front .num {

    top: 0;

}


/*
   BACK
*/

.flip-back {

    position: absolute;

    width: 100%;
    height: 100%;

    background: #111;

    backface-visibility: hidden;

    overflow: hidden;

    border-radius: 22px;

    transform:
        rotateX(180deg);

}


/*
   Number on back
*/

.flip-back .num {

    top: -100%;

}


/* =========================================
   FULL 180 DEGREE FLIP
========================================= */

.flip-card.animate {

    animation:

        fullFlip

        0.8s

        cubic-bezier(
            0.4,
            0.05,
            0.2,
            1
        )

        forwards;

}


@keyframes fullFlip {

    0% {

        transform:
            rotateX(0deg);

    }


    50% {

        transform:
            rotateX(90deg);

    }


    100% {

        transform:
            rotateX(180deg);

    }

}


/* =========================================
   COLONS
========================================= */

.colon {

    color: #777;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 65px;

    font-weight: 700;

    margin-left: -12px;

    margin-right: -12px;

    user-select: none;
}


/* =========================================
   LABEL
========================================= */

.label {

    position: fixed;

    left: 28px;

    bottom: 20px;

    color: #666;

    font-size: 14px;

    letter-spacing: 1px;
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 1400px) {

    .digit {

        width: 155px;

        height: 240px;

    }


    .num {

        font-size: 205px;

    }


    .clock {

        gap: 18px;

    }


    .group {

        gap: 7px;

    }


    .colon {

        font-size: 50px;

    }

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 850px) {

    .clock {

        gap: 5px;

    }


    .group {

        gap: 3px;

    }


    .digit {

        width: 14.5vw;

        height: 24vw;

        border-radius: 10px;

    }


    .num {

        font-size: 20vw;

        letter-spacing: -8px;

    }


    .colon {

        font-size: 25px;

        margin:
            0 -2px;

    }


    .period {

        top: 15px;

        left: 18px;

        font-size: 20px;

    }

}

</style>

</head>


<body>


<!-- ======================================
     AM / PM
======================================= -->

<div
    class="period"
    id="period">

    AM

</div>



<!-- ======================================
     CLOCK
======================================= -->

<div class="clock">


    <!-- ================= HOURS ================= -->

    <div class="group">

        <div
            class="digit"
            id="hour1">
        </div>


        <div
            class="digit"
            id="hour2">
        </div>

    </div>



    <!-- COLON -->

    <div class="colon">
        :
    </div>



    <!-- ================= MINUTES ================= -->

    <div class="group">

        <div
            class="digit"
            id="minute1">
        </div>


        <div
            class="digit"
            id="minute2">
        </div>

    </div>



    <!-- COLON -->

    <div class="colon">
        :
    </div>



    <!-- ================= SECONDS ================= -->

    <div class="group">

        <div
            class="digit"
            id="second1">
        </div>


        <div
            class="digit"
            id="second2">
        </div>

    </div>


</div>



<!-- ======================================
     LABEL
======================================= -->

<div class="label">

    IST • INDIA STANDARD TIME

</div>



<script>


/* =========================================
   DIGIT IDs
========================================= */

const digitIDs = [

    "hour1",
    "hour2",

    "minute1",
    "minute2",

    "second1",
    "second2"

];


let previousTime = null;



/* =========================================
   CREATE DIGIT
========================================= */

function createDigit(
    element,
    value
) {

    element.innerHTML = `

        <!-- NORMAL TOP -->

        <div class="top">

            <div class="num">
                ${value}
            </div>

        </div>


        <!-- NORMAL BOTTOM -->

        <div class="bottom">

            <div class="num">
                ${value}
            </div>

        </div>


        <!-- FULL ROTATING CARD -->

        <div class="flip-card">

            <!-- FRONT -->

            <div class="flip-front">

                <div class="num">
                    ${value}
                </div>

            </div>


            <!-- BACK -->

            <div class="flip-back">

                <div class="num">
                    ${value}
                </div>

            </div>

        </div>

    `;

}



/* =========================================
   INITIAL CLOCK
========================================= */

function setInitialTime(time) {

    digitIDs.forEach(
        function(id, index) {

            createDigit(

                document.getElementById(id),

                time[index]

            );

        }
    );

}



/* =========================================
   FULL FLIP
========================================= */

function flipDigit(
    element,
    oldValue,
    newValue
) {


    if (
        oldValue ===
        newValue
    ) {

        return;

    }


    const top =
        element.querySelector(
            ".top .num"
        );


    const bottom =
        element.querySelector(
            ".bottom .num"
        );


    const flipCard =
        element.querySelector(
            ".flip-card"
        );


    const front =
        element.querySelector(
            ".flip-front .num"
        );


    const back =
        element.querySelector(
            ".flip-back .num"
        );


    /*
       OLD number
       stays visible initially.
    */

    top.textContent =
        oldValue;


    bottom.textContent =
        newValue;


    front.textContent =
        oldValue;


    back.textContent =
        newValue;


    /*
       Remove previous animation.
    */

    flipCard.classList.remove(
        "animate"
    );


    /*
       Force browser reflow.
    */

    void flipCard.offsetWidth;


    /*
       START COMPLETE 180° ROTATION
    */

    flipCard.classList.add(
        "animate"
    );


    /*
       After the complete rotation,
       update the permanent digit.
    */

    setTimeout(
        function() {

            top.textContent =
                newValue;

            bottom.textContent =
                newValue;

            flipCard.classList.remove(
                "animate"
            );

        },
        800
    );

}



/* =========================================
   GET CURRENT IST TIME
========================================= */

function getISTTime() {


    const parts =

        new Intl.DateTimeFormat(

            "en-IN",

            {

                /*
                   FORCE INDIA TIME
                */

                timeZone:
                    "Asia/Kolkata",


                hour:
                    "2-digit",


                minute:
                    "2-digit",


                second:
                    "2-digit",


                hour12:
                    true

            }

        ).formatToParts(
            new Date()
        );



    let hour = "";

    let minute = "";

    let second = "";

    let period = "";



    /*
       Read time values.
    */

    for (
        const part of parts
    ) {


        if (
            part.type ===
            "hour"
        ) {

            hour =
                part.value;

        }


        if (
            part.type ===
            "minute"
        ) {

            minute =
                part.value;

        }


        if (
            part.type ===
            "second"
        ) {

            second =
                part.value;

        }


        if (
            part.type ===
            "dayPeriod"
        ) {

            period =
                part.value
                    .toUpperCase();

        }

    }



    /*
       Make hour two digits.

       9:05:07

       becomes

       09:05:07
    */

    hour =
        hour.padStart(
            2,
            "0"
        );



    return {

        time:
            hour +
            minute +
            second,

        period:
            period

    };

}



/* =========================================
   UPDATE CLOCK
========================================= */

function updateClock() {


    const current =
        getISTTime();



    /*
       AM / PM
    */

    document.getElementById(
        "period"
    ).textContent =
        current.period;



    /*
       First run
    */

    if (
        previousTime ===
        null
    ) {

        setInitialTime(
            current.time
        );

        previousTime =
            current.time;

        return;

    }



    /*
       Check all SIX digits.
    */

    digitIDs.forEach(
        function(id, index) {


            const oldDigit =
                previousTime[index];


            const newDigit =
                current.time[index];



            /*
               Flip only changed digits.
            */

            if (
                oldDigit !==
                newDigit
            ) {

                flipDigit(

                    document.getElementById(id),

                    oldDigit,

                    newDigit

                );

            }

        }
    );



    /*
       Save time.
    */

    previousTime =
        current.time;

}



/* =========================================
   START
========================================= */

updateClock();



/*
   Check every second.
*/

setInterval(
    updateClock,
    1000
);

</script>


</body>
</html>
