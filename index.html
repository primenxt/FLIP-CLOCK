<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IST Flip Clock</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #000;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    color: #bdbdbd;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================
   AM / PM
========================= */

.period {
    position: fixed;

    top: 28px;
    left: 35px;

    font-size: 42px;
    font-weight: 700;

    color: #bdbdbd;
}


/* =========================
   CLOCK
========================= */

.clock {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 20px;
}


/* =========================
   DIGIT GROUP
========================= */

.group {
    display: flex;
    gap: 10px;
}


/* =========================
   DIGIT CARD
========================= */

.digit {
    position: relative;

    width: 185px;
    height: 290px;

    background: #111;

    border-radius: 20px;

    overflow: hidden;

    perspective: 1000px;
}


/* =========================
   STATIC TOP
========================= */

.static-top {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 50%;

    overflow: hidden;

    background: #111;

    z-index: 1;
}


/* =========================
   STATIC BOTTOM
========================= */

.static-bottom {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 50%;

    overflow: hidden;

    background: #111;

    z-index: 1;
}


/* =========================
   NUMBER
========================= */

.number {
    position: absolute;

    left: 0;

    width: 100%;
    height: 200%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-variant-numeric:
        tabular-nums;

    font-size: 245px;

    font-weight: 700;

    line-height: 1;

    letter-spacing: -8px;

    color: #bdbdbd;

    user-select: none;
}


/* Top number positioning */
.static-top .number {
    top: 0;
}


/* Bottom number positioning */
.static-bottom .number {
    bottom: 0;
}


/* =========================
   FLIPPING TOP
========================= */

.flip-top {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 50%;

    overflow: hidden;

    background: #111;

    z-index: 10;

    transform-origin: bottom center;

    transform:
        rotateX(0deg);

    backface-visibility: hidden;

    transition:
        transform 0.28s cubic-bezier(
            0.4,
            0,
            0.2,
            1
        );

    box-shadow:
        0 2px 5px rgba(0,0,0,0.5);
}


.flip-top .number {
    top: 0;
}


/* =========================
   FLIPPING BOTTOM
========================= */

.flip-bottom {
    position: absolute;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 50%;

    overflow: hidden;

    background: #111;

    z-index: 9;

    transform-origin: top center;

    transform:
        rotateX(90deg);

    backface-visibility: hidden;

    transition:
        transform 0.28s cubic-bezier(
            0.4,
            0,
            0.2,
            1
        );
}


.flip-bottom .number {
    bottom: 0;
}


/* =========================
   CENTER LINE
========================= */

.digit::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;

    top: 50%;

    height: 5px;

    transform:
        translateY(-50%);

    background: #050505;

    z-index: 100;

    pointer-events: none;
}


/* =========================
   COLON
========================= */

.colon {
    color: #777;

    font-size: 65px;

    font-weight: 700;

    user-select: none;
}


/* =========================
   IST LABEL
========================= */

.label {
    position: fixed;

    left: 28px;
    bottom: 20px;

    color: #666;

    font-size: 14px;

    letter-spacing: 1px;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1400px) {

    .digit {
        width: 150px;
        height: 235px;
    }

    .number {
        font-size: 195px;
    }

    .clock {
        gap: 12px;
    }

    .group {
        gap: 7px;
    }

    .colon {
        font-size: 50px;
    }
}


@media (max-width: 850px) {

    .digit {
        width: 14vw;
        height: 23vw;

        border-radius: 10px;
    }

    .number {
        font-size: 19vw;

        letter-spacing: -4px;
    }

    .clock {
        gap: 4px;
    }

    .group {
        gap: 3px;
    }

    .colon {
        font-size: 25px;
    }

    .period {
        top: 15px;
        left: 18px;

        font-size: 20px;
    }
}

</style>
</head>


<body>


<div
    class="period"
    id="period">
    --
</div>


<div class="clock">

    <div class="group">

        <div class="digit" id="h1"></div>
        <div class="digit" id="h2"></div>

    </div>


    <div class="colon">:</div>


    <div class="group">

        <div class="digit" id="m1"></div>
        <div class="digit" id="m2"></div>

    </div>


    <div class="colon">:</div>


    <div class="group">

        <div class="digit" id="s1"></div>
        <div class="digit" id="s2"></div>

    </div>

</div>


<div class="label">
    IST • INDIA STANDARD TIME
</div>


<script>

/* =====================================================
   DIGIT ELEMENTS
===================================================== */

const ids = [
    "h1",
    "h2",
    "m1",
    "m2",
    "s1",
    "s2"
];


let currentDigits = null;


/* =====================================================
   CREATE A DIGIT
===================================================== */

function createDigit(element, value) {

    element.innerHTML = `

        <div class="static-top">
            <div class="number">
                ${value}
            </div>
        </div>

        <div class="static-bottom">
            <div class="number">
                ${value}
            </div>
        </div>

        <div class="flip-top">
            <div class="number">
                ${value}
            </div>
        </div>

        <div class="flip-bottom">
            <div class="number">
                ${value}
            </div>
        </div>

    `;
}


/* =====================================================
   INITIAL CLOCK
===================================================== */

function initializeClock(digits) {

    ids.forEach((id, index) => {

        createDigit(
            document.getElementById(id),
            digits[index]
        );

    });

    currentDigits = digits;
}


/* =====================================================
   FLIP ONE DIGIT
===================================================== */

function flipDigit(element, oldValue, newValue) {

    if (oldValue === newValue) {
        return;
    }


    const staticTop =
        element.querySelector(
            ".static-top .number"
        );

    const staticBottom =
        element.querySelector(
            ".static-bottom .number"
        );

    const flipTop =
        element.querySelector(
            ".flip-top"
        );

    const flipBottom =
        element.querySelector(
            ".flip-bottom"
        );

    const flipTopNumber =
        flipTop.querySelector(
            ".number"
        );

    const flipBottomNumber =
        flipBottom.querySelector(
            ".number"
        );


    /*
       OLD number on top
    */

    staticTop.textContent =
        oldValue;

    flipTopNumber.textContent =
        oldValue;


    /*
       NEW number underneath
    */

    staticBottom.textContent =
        newValue;

    flipBottomNumber.textContent =
        newValue;


    /*
       Reset positions
    */

    flipTop.style.transition = "none";
    flipBottom.style.transition = "none";

    flipTop.style.transform =
        "rotateX(0deg)";

    flipBottom.style.transform =
        "rotateX(90deg)";


    /*
       Force browser layout
    */

    void flipTop.offsetWidth;


    /*
       Restore transition
    */

    flipTop.style.transition =
        "transform 0.28s cubic-bezier(0.4,0,0.2,1)";

    flipBottom.style.transition =
        "transform 0.28s cubic-bezier(0.4,0,0.2,1)";


    /*
       FIRST HALF

       Old top folds downward.
    */

    flipTop.style.transform =
        "rotateX(-90deg)";


    /*
       SECOND HALF

       New bottom comes upward.

       Start at exactly the same
       animation cycle.
    */

    setTimeout(() => {

        flipBottom.style.transform =
            "rotateX(0deg)";

    }, 280);


    /*
       Complete the change.
    */

    setTimeout(() => {

        staticTop.textContent =
            newValue;

        staticBottom.textContent =
            newValue;


        flipTopNumber.textContent =
            newValue;

        flipBottomNumber.textContent =
            newValue;


        flipTop.style.transition = "none";
        flipBottom.style.transition = "none";

        flipTop.style.transform =
            "rotateX(0deg)";

        flipBottom.style.transform =
            "rotateX(90deg)";

    }, 600);
}


/* =====================================================
   GET EXACT IST
===================================================== */

function getIST() {

    const now = new Date();


    const parts =
        new Intl.DateTimeFormat(
            "en-IN",
            {
                timeZone:
                    "Asia/Kolkata",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hour12:
                    true
            }
        ).formatToParts(now);


    let hour = "";
    let minute = "";
    let second = "";
    let period = "";


    for (const part of parts) {

        if (
            part.type === "hour"
        ) {
            hour =
                part.value;
        }

        if (
            part.type === "minute"
        ) {
            minute =
                part.value;
        }

        if (
            part.type === "second"
        ) {
            second =
                part.value;
        }

        if (
            part.type === "dayPeriod"
        ) {
            period =
                part.value.toUpperCase();
        }
    }


    hour =
        hour.padStart(2, "0");

    minute =
        minute.padStart(2, "0");

    second =
        second.padStart(2, "0");


    return {

        digits:
            hour +
            minute +
            second,

        period:
            period
    };
}


/* =====================================================
   UPDATE DISPLAY
===================================================== */

function updateDisplay() {

    const time =
        getIST();


    /*
       AM / PM
    */

    document.getElementById(
        "period"
    ).textContent =
        time.period;


    /*
       First load
    */

    if (currentDigits === null) {

        initializeClock(
            time.digits
        );

        return;
    }


    /*
       Find which digits changed.
    */

    const changed = [];


    ids.forEach((id, index) => {

        if (
            currentDigits[index] !==
            time.digits[index]
        ) {

            changed.push({
                id: id,
                oldValue:
                    currentDigits[index],
                newValue:
                    time.digits[index]
            });

        }
    });


    /*
       IMPORTANT:
       Start EVERY changed digit in
       the SAME JavaScript execution frame.

       This keeps 59 -> 00,
       09 -> 10,
       etc. perfectly synchronized.
    */

    changed.forEach(change => {

        flipDigit(
            document.getElementById(
                change.id
            ),

            change.oldValue,

            change.newValue
        );

    });


    currentDigits =
        time.digits;
}


/* =====================================================
   PRECISION CLOCK LOOP
=====================================================

   DON'T USE setInterval(1000).

   It can drift.

   Instead, calculate the exact moment
   the next second begins.
===================================================== */

function preciseClockLoop() {

    updateDisplay();


    const now =
        Date.now();


    /*
       Find milliseconds until
       the next exact second.
    */

    const delay =
        1000 -
        (now % 1000);


    /*
       Schedule the next update
       exactly on the second boundary.
    */

    setTimeout(
        preciseClockLoop,
        delay
    );
}


/* =====================================================
   START
===================================================== */

preciseClockLoop();

</script>

</body>
</html>
